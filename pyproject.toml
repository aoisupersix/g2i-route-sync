[project]
name = "g2i-route-sync"
version = "0.1.0"
description = "Sync Garmin Connect routes to iGPSPORT via Python API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.15.0",
    "garminconnect>=0.3.4",
    "gpxpy>=1.6.2",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.15",
    "ty>=0.0.42",
]
